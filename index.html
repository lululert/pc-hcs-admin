<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<script>
		window.HCS_BUILD = '20261101'
		if (!/\bv=/.test(location.search)) {
			location.replace(location.pathname + '?v=' + window.HCS_BUILD)
		}
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<title>登录 - 餐饮供应链 HCS 管理端</title>
	<link rel="stylesheet" href="css/admin.css?v=20261101" />
</head>
<body>
	<div class="login-page">
		<div class="login-brand">
			<h1>餐饮供应链分布式<br />HCS 管理配套技术体系</h1>
			<p>
				合同技术目标、技术内容、方法路线与体系成果说明，并与节点、库存、调度、追溯、采购、预警、试点核验、HCS 规则等业务模块增删改查一体化呈现。
			</p>
		</div>
		<div class="login-panel-wrap">
			<div class="login-panel">
				<h2>管理端登录</h2>
				<p class="sub">HCS Supply Chain Management Console</p>
				<div id="loginError" class="login-error"></div>
				<form id="loginForm">
					<div class="form-group">
						<label for="username">账号</label>
						<input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" value="admin" />
					</div>
					<div class="form-group">
						<label for="password">密码</label>
						<input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" value="123456" />
					</div>
					<button type="submit" class="btn-primary">登 录</button>
				</form>
			</div>
		</div>
	</div>
	<script src="js/build.js?v=20261101"></script>
	<script src="js/store.js?v=20261101"></script>
	<script src="js/auth.js?v=20261101"></script>
	<script>
		var consoleUrl = 'console.html?v=' + (window.HCS_BUILD || '20261101')
		if (window.HcsAuth.getSession()) {
			location.replace(consoleUrl)
		}
		const form = document.getElementById('loginForm')
		const errEl = document.getElementById('loginError')
		form.addEventListener('submit', function (e) {
			e.preventDefault()
			const username = document.getElementById('username').value
			const password = document.getElementById('password').value
			const res = window.HcsAuth.login(username, password)
			if (res.ok) {
				location.href = consoleUrl
				return
			}
			errEl.textContent = res.message
			errEl.classList.add('show')
		})
	</script>
</body>
</html>
